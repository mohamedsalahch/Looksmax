name: Deploy

# Manual deploys only: Actions tab -> Deploy -> "Run workflow" -> pick the
# branch to deploy. Every job (typecheck, build, deploy) runs against the
# chosen branch's latest commit.
on:
  workflow_dispatch:

# Never run two deploys at once; a second push waits for the first to finish.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/mohamedsalahch/looksmax

jobs:
  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        app: [back, front, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Looksmaxtn/${{ matrix.app }}/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: Looksmaxtn/${{ matrix.app }}
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: Looksmaxtn/${{ matrix.app }}

  build:
    needs: typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: back
            context: Looksmaxtn/back
            build-args: |
              APP_PORT=3002
          - name: admin
            context: Looksmaxtn/admin
            build-args: |
              APP_PORT=3001
              NEXT_PUBLIC_BACKEND_URL=http://back:3002
          - name: front
            context: Looksmaxtn/front
            build-args: |
              APP_PORT=3000
              NEXT_PUBLIC_BACKEND_URL=http://back:3002
              NEXT_PUBLIC_GOOGLE_CLIENT_ID=587877553271-cdg0m72ja81a55h0avd786of0oivve0l.apps.googleusercontent.com
              NEXT_PUBLIC_R2_PUBLIC_HOST=cdn.looksmaxtn.com
          - name: generator-api
            context: Looksmaxtn/generator_api
            build-args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin "${{ github.ref_name }}"
            git checkout --force --detach "${{ github.sha }}"
            export TAG=${{ github.sha }}
            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml up -d --remove-orphans
            docker image prune -f
            echo "Waiting for services to come up..."
            sleep 15
            curl -fsS -o /dev/null http://127.0.0.1:12003/health && echo "generator OK"
            curl -fsS -o /dev/null http://127.0.0.1:12002 && echo "back OK"
            curl -fsS -o /dev/null http://127.0.0.1:12001 && echo "admin OK"
            curl -fsS -o /dev/null http://127.0.0.1:12000 && echo "front OK"
            docker compose -f docker-compose.deploy.yml ps
