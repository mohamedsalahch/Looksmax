version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: looksmax-mongodb
    restart: unless-stopped
    ports:
      # Exposing MongoDB is optional, usually better to keep it internal in production
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=looksmax-production
    networks:
      - looksmax-network

  # Python Generator API (FastAPI)
  generator_api:
    build:
      context: ./generator_api
      dockerfile: Dockerfile
    container_name: looksmax-generator-api
    restart: unless-stopped
    ports:
      - "12003:8000"
    env_file:
      - ./generator_api/.env
    networks:
      - looksmax-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Backend API (Next.js)
  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: looksmax-back
    restart: unless-stopped
    ports:
      - "12001:3004"
    env_file:
      - ./back/.env
    depends_on:
      - mongodb
    networks:
      - looksmax-network

  # Admin Panel (Next.js)
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: looksmax-admin
    restart: unless-stopped
    ports:
      - "12002:3003"
    env_file:
      - ./admin/.env
    depends_on:
      - back
    networks:
      - looksmax-network

  # Frontend Storefront (Next.js)
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: looksmax-front
    restart: unless-stopped
    ports:
      - "12000:3000"
    env_file:
      - ./front/.env
    depends_on:
      - back
    networks:
      - looksmax-network

networks:
  looksmax-network:
    driver: bridge

volumes:
  mongodb_data:
