version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: looksmax-mongodb
    restart: unless-stopped
    # We should avoid exposing MongoDB directly to the internet in production. 
    # It will remain accessible internally on 'mongodb:27017' for other services.
    # ports:
    #   - "27017:27017" # Disabled for security unless you need external DB tools.
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=looksmax-production
    networks:
      - looksmax-network

  # Python Generator API (FastAPI)
  generator_api:
    image: gor3i/looksmax-generator-api
    container_name: looksmax-generator-api
    restart: unless-stopped
    ports:
      - "12003:8000" # Python: 12003
    env_file:
      - ./generator_api/.env
    networks:
      - looksmax-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Backend API (Next.js)
  back:
    image: gor3i/looksmax-back
    container_name: looksmax-back
    restart: unless-stopped
    ports:
      - "12002:3004" # Back: 12002
    env_file:
      - ./back/.env
    depends_on:
      - mongodb
    networks:
      - looksmax-network

  # Admin Panel (Next.js)
  admin:
    image: gor3i/looksmax-admin
    container_name: looksmax-admin
    restart: unless-stopped
    ports:
      - "12001:3003" # Admin: 12001
    env_file:
      - ./admin/.env
    depends_on:
      - back
    networks:
      - looksmax-network

  # Frontend Storefront (Next.js)
  front:
    image: gor3i/looksmax-front
    container_name: looksmax-front
    restart: unless-stopped
    ports:
      - "12000:3000" # Front: 12000
    env_file:
      - ./front/.env
    depends_on:
      - back
    networks:
      - looksmax-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: looksmax-nginx
    restart: unless-stopped
    ports:
      - "12005:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - front
      - admin
      - back
      - generator_api
    networks:
      - looksmax-network

networks:
  looksmax-network:
    driver: bridge

volumes:
  mongodb_data:
