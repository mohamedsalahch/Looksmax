services:
  mongodb:
    image: mongo:8.0
    container_name: looksmax-mongodb
    restart: always
    volumes:
      - mongodb_data:/data/db

  generator_api:
    build:
      context: ./generator_api
    container_name: looksmax-generator
    env_file:
      - ./generator_api/.env.production
    ports:
      - "127.0.0.1:12003:3003"
    depends_on:
      - mongodb
    restart: always

  back:
    build:
      context: ./back
      args:
        APP_PORT: 3002
    container_name: looksmax-back
    env_file:
      - ./back/.env.production
    volumes:
      - shared_uploads:/shared-uploads
    ports:
      - "127.0.0.1:12002:3002"
    depends_on:
      - mongodb
      - generator_api
    restart: always

  admin:
    build:
      context: ./admin
      args:
        APP_PORT: 3001
        NEXT_PUBLIC_BACKEND_URL: http://back:3002
    container_name: looksmax-admin
    env_file:
      - ./admin/.env.production
    volumes:
      - shared_uploads:/shared-uploads
    ports:
      - "127.0.0.1:12001:3001"
    depends_on:
      - back
    restart: always

  front:
    build:
      context: ./front
      args:
        APP_PORT: 3000
        NEXT_PUBLIC_BACKEND_URL: http://back:3002
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: 587877553271-cdg0m72ja81a55h0avd786of0oivve0l.apps.googleusercontent.com
        NEXT_PUBLIC_R2_PUBLIC_HOST: cdn.looksmaxtn.com
    container_name: looksmax-front
    env_file:
      - ./front/.env.production
    volumes:
      - shared_uploads:/shared-uploads
    ports:
      - "127.0.0.1:12000:3000"
    depends_on:
      - back
    restart: always

volumes:
  mongodb_data:
  shared_uploads:
