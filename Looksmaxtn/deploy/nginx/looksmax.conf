map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

upstream looksmax_front {
  server 127.0.0.1:12000;
  keepalive 32;
}

upstream looksmax_admin {
  server 127.0.0.1:12001;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name looksmaxtn.com www.looksmaxtn.com;

  return 301 https://looksmaxtn.com$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name admin.looksmaxtn.com;

  return 301 https://admin.looksmaxtn.com$request_uri;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  client_max_body_size 50m;

  location / {
    proxy_pass http://looksmax_front;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name looksmaxtn.com www.looksmaxtn.com;

  ssl_certificate /etc/letsencrypt/live/looksmaxtn.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/looksmaxtn.com/privkey.pem;

  client_max_body_size 50m;

  location / {
    proxy_pass http://looksmax_front;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name admin.looksmaxtn.com;

  ssl_certificate /etc/letsencrypt/live/looksmaxtn.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/looksmaxtn.com/privkey.pem;

  client_max_body_size 50m;

  location / {
    proxy_pass http://looksmax_admin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
