server {
  listen 80;
  listen [::]:80;
  server_name looksmaxtn.com www.looksmaxtn.com;

  return 301 https://looksmaxtn.com$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name admin.looksmaxtn.com;

  return 301 https://admin.looksmaxtn.com$request_uri;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  return 444;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name looksmaxtn.com www.looksmaxtn.com;

  ssl_certificate /etc/letsencrypt/live/looksmaxtn.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/looksmaxtn.com/privkey.pem;

  client_max_body_size 50m;

  location /_next/static/ {
    proxy_pass http://127.0.0.1:12000;
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 4s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location / {
    proxy_pass http://127.0.0.1:12000;
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 4s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-cache, no-store, max-age=0, must-revalidate" always;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}

