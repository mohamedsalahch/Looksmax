events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    
    # Increase proxy buffers for Next.js
    proxy_buffers 16 16k;  
    proxy_buffer_size 16k;

    # 1. FRONTEND
    server {
        listen 80;
        server_name 51.75.126.19 looksmaxtn.com www.looksmaxtn.com;

        location / {
            proxy_pass http://front:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # 2. ADMIN PANEL
    server {
        listen 80;
        server_name admin.51.75.126.19 admin.looksmaxtn.com;

        location / {
            proxy_pass http://admin:3003;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # 3. BACKEND API
    server {
        listen 80;
        server_name api.51.75.126.19 api.looksmaxtn.com;

        location / {
            proxy_pass http://back:3004;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # 4. PYTHON GENERATOR API
    server {
        listen 80;
        server_name ai.51.75.126.19 ai.looksmaxtn.com;

        location / {
            proxy_pass http://generator_api:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}

